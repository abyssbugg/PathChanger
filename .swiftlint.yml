disabled_rules:
  - multiple_closures_with_trailing_closure

line_length:
  warning: 300
  error: 350
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

file_length:
  warning: 1000
  error: 1200
type_body_length:
  warning: 450
  error: 600

function_body_length:
  warning: 150
  error: 220
