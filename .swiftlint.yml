disabled_rules:
  - multiple_closures_with_trailing_closure

# Build products and local recovery staging are not source. CI never sees these
# (it lints a fresh checkout), but they otherwise swamp local `swiftlint lint`
# runs, which CONTRIBUTING.md tells contributors to run before committing.
excluded:
  - .build
  - .recovery
  - dist
  - DerivedData

line_length:
  warning: 300
  error: 350
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

file_length:
  warning: 1000
  error: 1200
type_body_length:
  warning: 450
  error: 600

function_body_length:
  warning: 150
  error: 220
