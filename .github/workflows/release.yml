name: Release

on:
  release:
    types: [published]

env:
  APP_NAME: PathChanger

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish GitHub Artifacts
    runs-on: macos-14

    permissions:
      contents: write

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Toolchain Diagnostics
      run: |
        set -euo pipefail
        xcodebuild -version
        xcode-select -p
        swift --version

    - name: Validate Release Configuration
      run: |
        set -euo pipefail
        chmod +x scripts/validate-release-config.sh
        scripts/validate-release-config.sh

    - name: Validate Release Inputs
      id: version
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
          echo "Release tag must use vMAJOR.MINOR.PATCH format: $GITHUB_REF_NAME" >&2
          exit 1
        }

        VERSION="${GITHUB_REF_NAME#v}"
        PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
        BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)

        [ "$VERSION" = "$PLIST_VERSION" ] || {
          echo "Release tag version ($VERSION) does not match Info.plist ($PLIST_VERSION)" >&2
          exit 1
        }
        [[ "$BUILD" =~ ^[0-9]+$ ]] || {
          echo "CFBundleVersion must be numeric: $BUILD" >&2
          exit 1
        }

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD" >> "$GITHUB_OUTPUT"
        echo "Version: $VERSION, Build: $BUILD"

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build Release
      run: swift build -c release

    - name: Create App Bundle (Ad-Hoc)
      run: |
        set -euo pipefail
        chmod +x build-app-bundle.sh
        APP_BUNDLE_BUILD_ROOT="${RUNNER_TEMP}/pathchanger-app-build"
        BUILD_CONFIGURATION=release APP_BUNDLE_BUILD_ROOT="$APP_BUNDLE_BUILD_ROOT" ./build-app-bundle.sh
        echo "APP_BUNDLE_BUILD_ROOT=$APP_BUNDLE_BUILD_ROOT" >> "$GITHUB_ENV"

    - name: Verify App Bundle
      run: |
        set -euo pipefail
        APP="${APP_BUNDLE_BUILD_ROOT}/PathChanger.app"
        EXECUTABLE="$APP/Contents/MacOS/PathChanger"
        PLIST="$APP/Contents/Info.plist"

        test -d "$APP"
        test -x "$EXECUTABLE"
        test -x "$APP/Contents/Resources/scripts/location_bridge.py"
        test -x "$APP/Contents/Resources/scripts/pair_wifi.py"

        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" | grep -qx "com.pathchanger.app"
        /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" | grep -qx "${{ steps.version.outputs.version }}"

        codesign --verify --deep --strict --verbose=2 "$APP"
        if xattr -lr "$APP" 2>/dev/null | grep -E 'com\.apple\.(FinderInfo|ResourceFork|fileprovider\.fpfs#P)'; then
          echo "Forbidden xattrs remain in app bundle" >&2
          exit 1
        fi

    - name: Create GitHub Distribution Archive
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        ZIP_PATH="build/PathChanger-${VERSION}-macOS.zip"
        CHECKSUM_PATH="build/PathChanger-${VERSION}-macOS.sha256"

        mkdir -p build
        rm -f "$ZIP_PATH" "$CHECKSUM_PATH"
        ditto -c -k --sequesterRsrc --keepParent "${APP_BUNDLE_BUILD_ROOT}/PathChanger.app" "$ZIP_PATH"
        test -s "$ZIP_PATH"
        shasum -a 256 "$ZIP_PATH" > "$CHECKSUM_PATH"
        test -s "$CHECKSUM_PATH"
        cat "$CHECKSUM_PATH"

    - name: Upload Release Assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        ZIP_PATH="build/PathChanger-${VERSION}-macOS.zip"
        CHECKSUM_PATH="build/PathChanger-${VERSION}-macOS.sha256"

        test -s "$ZIP_PATH"
        test -s "$CHECKSUM_PATH"
        gh release upload "$GITHUB_REF_NAME" \
          "$ZIP_PATH" \
          "$CHECKSUM_PATH" \
          --clobber

    - name: Summary
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        echo "## 🚀 Release $VERSION Published!" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Downloads" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Zip**: [PathChanger-${VERSION}-macOS.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PathChanger-${VERSION}-macOS.zip)" >> "$GITHUB_STEP_SUMMARY"
        echo "- **SHA-256**: [PathChanger-${VERSION}-macOS.sha256](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PathChanger-${VERSION}-macOS.sha256)" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### Distribution Notes" >> "$GITHUB_STEP_SUMMARY"
        echo "- Build style: ad-hoc signed app bundle (no Apple Developer subscription required)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Packaging: GitHub direct download + checksum verification" >> "$GITHUB_STEP_SUMMARY"