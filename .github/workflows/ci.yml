name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & Test
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Toolchain Diagnostics
      run: |
        xcodebuild -version
        xcode-select -p
        swift --version

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Validate Release Configuration
      run: |
        chmod +x scripts/validate-release-config.sh
        scripts/validate-release-config.sh

    - name: Validate W1 Convergence Lock
      run: |
        chmod +x scripts/validate-w1-convergence-lock.sh
        scripts/validate-w1-convergence-lock.sh

    - name: Build (Debug)
      run: swift build -c debug

    - name: Build (Release)
      run: swift build -c release

    - name: Run Unit Tests
      timeout-minutes: 20
      env:
        PATHCHANGER_RUN_DEVICE_TESTS: "0"
      run: swift test --enable-code-coverage

    - name: Build App Bundle Smoke Test
      run: |
        chmod +x build-app-bundle.sh
        # build-app-bundle.sh now mints a unique mktemp workspace by default, so
        # pass an explicit private workspace to keep the bundle path deterministic.
        APP_BUNDLE_BUILD_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/pc-ci-build.XXXXXXXX")"
        export APP_BUNDLE_BUILD_ROOT
        ./build-app-bundle.sh

        APP="$APP_BUNDLE_BUILD_ROOT/PathChanger.app"
        EXECUTABLE="$APP/Contents/MacOS/PathChanger"
        PLIST="$APP/Contents/Info.plist"

        test -d "$APP"
        test -x "$EXECUTABLE"

        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" | grep -qx "com.pathchanger.app"

        codesign --verify --verbose "$APP"

    - name: Generate Coverage Report
      run: |
        xcrun llvm-cov export \
          .build/debug/PathChangerPackageTests.xctest/Contents/MacOS/PathChangerPackageTests \
          -instr-profile=.build/debug/codecov/default.profdata \
          -format=lcov > coverage.lcov
        test -s coverage.lcov

  python-lock:
    name: Python Dependency Lock
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Verify hashed dependency lock installs cleanly
      run: |
        python3 -m venv "${RUNNER_TEMP}/pc-lockcheck-venv"
        # shellcheck disable=SC1091
        source "${RUNNER_TEMP}/pc-lockcheck-venv/bin/activate"
        python -m pip install --upgrade pip
        # --require-hashes fails closed if any package or transitive dep lacks a
        # pinned sha256; --no-deps installs exactly the locked closure.
        python -m pip install --require-hashes --no-deps -r requirements-pathchanger.lock
        python -m pymobiledevice3 version 2>&1 | grep -q "9.12.0" \
          || { echo "Installed pymobiledevice3 does not report expected version 9.12.0"; exit 1; }

    - name: Assert lock stays in sync with the direct pin
      run: |
        grep -q '^pymobiledevice3==9.12.0' requirements-pathchanger.lock \
          || { echo "requirements-pathchanger.lock must pin pymobiledevice3==9.12.0"; exit 1; }

  lint:
    name: Swift Lint
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Install SwiftLint (pinned + checksum-verified)
      run: |
        SWIFTLINT_VERSION="0.65.0"
        SWIFTLINT_SHA256="d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6"
        curl -fsSL -o portable_swiftlint.zip \
          "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
        echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
        mkdir -p .swiftlint-bin
        unzip -o -q portable_swiftlint.zip -d .swiftlint-bin
        .swiftlint-bin/swiftlint version

    - name: Run SwiftLint
      run: .swiftlint-bin/swiftlint lint --quiet

  security-scan:
    name: Security Scan
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Secret Scan (gitleaks, pinned + checksum-verified)
      run: |
        GITLEAKS_VERSION="8.30.1"
        GITLEAKS_SHA256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
        curl -fsSL -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | shasum -a 256 -c -
        mkdir -p .gitleaks-bin
        tar -xzf gitleaks.tar.gz -C .gitleaks-bin gitleaks
        # Scan all files in the checkout (every file type), redacting any matches.
        .gitleaks-bin/gitleaks detect --source . --no-git --no-banner --redact --exit-code 1

    - name: Check Entitlements Policy
      run: |
        ENT="Resources/PathChanger.entitlements"
        test -f "$ENT" || { echo "Entitlements file missing: $ENT"; exit 1; }
        plutil -lint "$ENT" >/dev/null
        # Fail if any high-risk code-signing entitlement is enabled.
        for key in \
          com.apple.security.cs.allow-unsigned-executable-memory \
          com.apple.security.cs.disable-library-validation \
          com.apple.security.cs.allow-dyld-environment-variables \
          com.apple.security.cs.allow-jit \
          com.apple.security.get-task-allow; do
          if /usr/libexec/PlistBuddy -c "Print :$key" "$ENT" 2>/dev/null | grep -qx "true"; then
            echo "High-risk entitlement must not be enabled: $key"
            exit 1
          fi
        done
        echo "Entitlement policy OK (no high-risk code-signing entitlements enabled)."

  documentation:
    name: Build Documentation
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Build DocC Documentation
      run: |
        DERIVED_DATA_PATH="${RUNNER_TEMP}/pathchanger-docc-derived-data"
        xcodebuild -scheme PathChanger -destination "platform=macOS" -derivedDataPath "$DERIVED_DATA_PATH" docbuild
        DOC_ARCHIVE_PATH="$(find "$DERIVED_DATA_PATH" -name "*.doccarchive" -type d -print -quit)"
        test -n "$DOC_ARCHIVE_PATH"
        test -d "$DOC_ARCHIVE_PATH"
