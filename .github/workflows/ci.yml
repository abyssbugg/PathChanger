name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Toolchain Diagnostics
      run: |
        xcodebuild -version
        xcode-select -p
        swift --version
        
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build (Debug)
      run: swift build -c debug

    - name: Build (Release)
      run: swift build -c release

    - name: Run Unit Tests
      run: swift test --enable-code-coverage

    - name: Build App Bundle Smoke Test
      run: |
        chmod +x build-app-bundle.sh
        ./build-app-bundle.sh

        APP="build/PathChanger.app"
        EXECUTABLE="$APP/Contents/MacOS/PathChanger"
        PLIST="$APP/Contents/Info.plist"
        SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"

        test -d "$APP"
        test -x "$EXECUTABLE"
        test -d "$SPARKLE"

        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" | grep -qx "com.pathchanger.app"

        codesign --verify --verbose "$APP"
        otool -L "$EXECUTABLE" | grep -q "@rpath/Sparkle.framework"
      
    - name: Generate Coverage Report
      run: |
        xcrun llvm-cov export \
          .build/debug/PathChangerPackageTests.xctest/Contents/MacOS/PathChangerPackageTests \
          -instr-profile=.build/debug/codecov/default.profdata \
          -format=lcov > coverage.lcov || true
          
    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        files: coverage.lcov
        fail_ci_if_error: false
      continue-on-error: true
      
    - name: Upload Build Artifacts on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          .build/debug/*.log
          .build/release/*.log
        retention-days: 7

  lint:
    name: Swift Lint
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint || true
      
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging || true
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Check for Secrets
      run: |
        # Check for common secret patterns
        if grep -rE "(api[_-]?key|secret|password|token)\s*[:=]\s*['\"][^'\"]+['\"]" \
          --include="*.swift" --include="*.json" --include="*.plist" \
          --exclude-dir=.git --exclude-dir=.build .; then
          echo "::warning::Potential secrets detected in code"
        fi
        
    - name: Check Entitlements
      run: |
        if [ -f "Resources/PathChanger.entitlements" ]; then
          echo "Checking entitlements..."
          cat Resources/PathChanger.entitlements
        fi

  documentation:
    name: Build Documentation
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build DocC Documentation
      run: |
        mkdir -p .build/docc-output
        swift package generate-documentation \
          --target PathChanger \
          --disable-indexing \
          --transform-for-static-hosting \
          --hosting-base-path PathChanger \
          --output-path .build/docc-output
      continue-on-error: true
      
    - name: Upload Documentation Preview
      uses: actions/upload-artifact@v4
      with:
        name: docc-preview
        path: .build/docc-output
        if-no-files-found: ignore

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    needs: documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_DOCC == 'true'
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Download Documentation Preview
      uses: actions/download-artifact@v4
      with:
        name: docc-preview
        path: docc-preview

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docc-preview
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
