name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        # Use Xcode 15.4 (Swift 5.10) for compatibility - Xcode 16 has Swift 6 strict concurrency
        xcode-version: '15.4'
        
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build (Debug)
      run: swift build -c debug

    - name: Build (Release)
      run: swift build -c release

    - name: Run Unit Tests
      run: swift test --enable-code-coverage
      
    - name: Generate Coverage Report
      run: |
        xcrun llvm-cov export \
          .build/debug/PathChangerPackageTests.xctest/Contents/MacOS/PathChangerPackageTests \
          -instr-profile=.build/debug/codecov/default.profdata \
          -format=lcov > coverage.lcov || true
          
    - name: Upload Coverage
      uses: codecov/codecov-action@v4
      with:
        files: coverage.lcov
        fail_ci_if_error: false
      continue-on-error: true
      
    - name: Upload Build Artifacts on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          .build/debug/*.log
          .build/release/*.log
        retention-days: 7

  lint:
    name: Swift Lint
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint || true
      
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging || true
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Check for Secrets
      run: |
        # Check for common secret patterns
        if grep -rE "(api[_-]?key|secret|password|token)\s*[:=]\s*['\"][^'\"]+['\"]" \
          --include="*.swift" --include="*.json" --include="*.plist" \
          --exclude-dir=.git --exclude-dir=.build .; then
          echo "::warning::Potential secrets detected in code"
        fi
        
    - name: Check Entitlements
      run: |
        if [ -f "Resources/PathChanger.entitlements" ]; then
          echo "Checking entitlements..."
          cat Resources/PathChanger.entitlements
        fi

  documentation:
    name: Build Documentation
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build DocC Documentation
      run: |
        swift package generate-documentation \
          --target PathChanger \
          --disable-indexing \
          --transform-for-static-hosting \
          --hosting-base-path PathChanger \
          --output-path docs || true
      continue-on-error: true
      
    - name: Upload Documentation Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    needs: documentation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
