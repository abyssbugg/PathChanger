name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & Test
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Toolchain Diagnostics
      run: |
        xcodebuild -version
        xcode-select -p
        swift --version

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Validate Release Configuration
      run: |
        chmod +x scripts/validate-release-config.sh
        scripts/validate-release-config.sh

    - name: Validate W1 Convergence Lock
      run: |
        chmod +x scripts/validate-w1-convergence-lock.sh
        scripts/validate-w1-convergence-lock.sh

    - name: Build (Debug)
      run: swift build -c debug

    - name: Build (Release)
      run: swift build -c release

    - name: Run Unit Tests
      timeout-minutes: 20
      env:
        PATHCHANGER_RUN_DEVICE_TESTS: "0"
      run: swift test --enable-code-coverage

    - name: Build App Bundle Smoke Test
      run: |
        chmod +x build-app-bundle.sh
        ./build-app-bundle.sh

        APP="${TMPDIR:-/tmp}/pathchanger-app-build/PathChanger.app"
        EXECUTABLE="$APP/Contents/MacOS/PathChanger"
        PLIST="$APP/Contents/Info.plist"
        SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"

        test -d "$APP"
        test -x "$EXECUTABLE"
        test -d "$SPARKLE"

        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST" | grep -qx "PathChanger"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" | grep -qx "com.pathchanger.app"

        codesign --verify --verbose "$APP"
        otool -L "$EXECUTABLE" | grep -q "@rpath/Sparkle.framework"

    - name: Generate Coverage Report
      run: |
        xcrun llvm-cov export \
          .build/debug/PathChangerPackageTests.xctest/Contents/MacOS/PathChangerPackageTests \
          -instr-profile=.build/debug/codecov/default.profdata \
          -format=lcov > coverage.lcov
        test -s coverage.lcov

  lint:
    name: Swift Lint
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --quiet

  security-scan:
    name: Security Scan
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Check for Secrets
      run: |
        if grep -rE "(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]" \
          --include="*.swift" --include="*.json" --include="*.plist" \
          --exclude-dir=.git --exclude-dir=.build --exclude-dir=Tests .; then
          echo "Potential secrets detected in code"
          exit 1
        fi

    - name: Check Entitlements
      run: |
        if [ -f "Resources/PathChanger.entitlements" ]; then
          echo "Checking entitlements..."
          cat Resources/PathChanger.entitlements
        fi

  documentation:
    name: Build Documentation
    runs-on: macos-14

    steps:
    - name: Checkout
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git init "$GITHUB_WORKSPACE"
        git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
        git -C "$GITHUB_WORKSPACE" config gc.auto 0
        git -C "$GITHUB_WORKSPACE" config advice.detachedHead false
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')
        git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --prune --depth=1 origin "$GITHUB_SHA"
        git -C "$GITHUB_WORKSPACE" checkout --force FETCH_HEAD

    - name: Build DocC Documentation
      run: |
        mkdir -p .build/docc-output
        printf "%s\n" "DocC generation is disabled in CI until an accessible DocC toolchain is configured." > .build/docc-output/README.txt
        printf "%s\n" "This job validates the documentation stage without invoking DocC generation." >> .build/docc-output/README.txt
